server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: order-service

              uri: http://app:8081

              predicates:
                - Path=/api/v1/orders/**

            - id: auth-service

              uri: http://app:8081

              predicates:
                - Path=/api/v1/auth/**

            - id: inventory-service

              uri: http://inventory-service:8084

              predicates:
                - Path=/api/v1/products/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus

jwt:
  secret: mySuperSecretKeyMySuperSecretKey123

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"