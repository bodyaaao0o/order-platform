server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:

      routes:

        - id: order-service

          uri: http://app:8081

          predicates:
            - Path=/api/v1/orders/**

        - id: auth-service

          uri: http://app:8081

          predicates:
            - Path=/api/v1/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

jwt:
  secret: mySuperSecretKeyMySuperSecretKey123