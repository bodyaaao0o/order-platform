spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5433/order_platform
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true

  jackson:
    time-zone: Europe/Kyiv

jwt:
  secret: mySuperSecretKeyMySuperSecretKey123

logging:
  level:
    org.hibernate.SQL: DEBUG

server:
  port: 8081